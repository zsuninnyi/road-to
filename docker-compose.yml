services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: roadto
      POSTGRES_PASSWORD: roadto
      POSTGRES_DB: roadto
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U roadto -d roadto']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
